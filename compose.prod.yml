# docker-compose.prod.yml (for TrueNAS Scale)
version: '3.8'
services:
  app:
    build: .
    ports:
      - '8080:80'
    volumes:
      - app_media:/app/backend/media
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  app_media:
