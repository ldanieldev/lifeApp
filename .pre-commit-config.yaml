repos:
  # Ruff for Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
      - id: ruff
        files: ^backend/.*\.py$
        exclude: |
          (?x)(
            ^backend/.*/migrations/.*\.py$|
            ^backend/.*/__init__\.py$|
            ^backend/manage\.py$
          )
        args: [--fix, --config, backend/pyproject.toml] # Auto-fix issues using backend config
      - id: ruff-format
        files: ^backend/.*\.py$
        exclude: |
          (?x)(
            ^backend/.*/migrations/.*\.py$|
            ^backend/.*/__init__\.py$
          )
        args: [--config, backend/pyproject.toml] # Use backend config for formatting

  # Frontend tools
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|md|json)$
        additional_dependencies: ['prettier@3.6.2']
        args: [--config, frontend/.prettierrc, --write] # Use frontend prettier config

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        args: [--config, frontend/eslint.config.js]
        additional_dependencies:
          - 'eslint@^9.32.0'
          - '@eslint/js@^9.32.0'
          - 'eslint-plugin-react-hooks@^5.2.0'
