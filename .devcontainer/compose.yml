services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.13
    volumes:
      - ..:/workspace:cached
      - vscode-server:/root/.vscode-server
    command: sleep infinity
    depends_on:
      - db
    env_file:
      - ../.env
    environment:
      # Override or add specific dev container vars
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:${DB_PORT:-5432}/${POSTGRES_DB:-life_app}

  db:
    image: postgres:17
    env_file:
      - ../.env
    environment:
      # Dev-specific overrides
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-life_app}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - '5540:5540'
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  prometheus:
    image: prom/prometheus:latest
    env_file:
      - ../.env
    volumes:
      - ../config/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ../config/entrypoint-prometheus.sh:/entrypoint-prometheus.sh:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/entrypoint-prometheus.sh"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--enable-feature=remote-write-receiver'
    ports:
      - '9090:9090'  # Prometheus Web UI (optional, for debugging)
    depends_on:
      - app

  garage:
    image: dxflrs/garage:v1.1.0
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ../config/garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
    # RPC secret is hardcoded in garage.toml for development
    # No external ports - only accessible within Docker network

  celery-worker:
    image: mcr.microsoft.com/devcontainers/python:3.13
    working_dir: /workspace/backend
    command: >
      bash -c "pip install -r requirements.txt &&
               celery -A core worker -l INFO"
    volumes:
      - ..:/workspace:cached
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:${DB_PORT:-5432}/${POSTGRES_DB:-life_app}
    depends_on:
      - db
      - redis

  celery-beat:
    image: mcr.microsoft.com/devcontainers/python:3.13
    working_dir: /workspace/backend
    command: >
      bash -c "pip install -r requirements.txt &&
               celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - ..:/workspace:cached
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:${DB_PORT:-5432}/${POSTGRES_DB:-life_app}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  redis_insight_data:
  elasticsearch_data:
  prometheus_data:
  vscode-server:
  garage_meta:
  garage_data:
